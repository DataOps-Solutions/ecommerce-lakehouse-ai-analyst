[project]
name = "ecommerce-lakehouse-ai-analyst"
version = "0.1.0"
description = "Mini Lakehouse (Delta Medallion) + AI/BI SQL analyst for e-commerce"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N"]
"notebooks/*" = ["E402"]
"app/dashboard.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "app"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sqlglot", "sqlglot.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
